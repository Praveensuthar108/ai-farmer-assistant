# Test Environment Configuration

# Server Configuration
server.port=8081
spring.application.name=ai-farmer-assistant-test

# Database Configuration (H2 in-memory for testing)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (for debugging tests)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=./test-uploads

# JWT Configuration (Test values)
jwt.secret=testSecretKeyForJWTTokenGenerationInTestEnvironment1234567890
jwt.expiration=3600000

# API Keys (Mock values for testing)
plantid.api.key=test-plant-id-key
plantid.api.url=http://localhost:8081/mock/plantid
openai.api.key=test-openai-key
openai.api.url=http://localhost:8081/mock/openai
openweather.api.key=test-weather-key
openweather.api.url=http://localhost:8081/mock/weather

# CORS Configuration
cors.allowed-origins=http://localhost:3000

# Logging Configuration
logging.level.root=INFO
logging.level.com.farmer=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

